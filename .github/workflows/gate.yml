name: gate

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: git ls-files '*.sh' bin/* | xargs bash -n
      - run: python3 -m unittest discover -s tests -v
      - run: bash tests/test_apply.sh
      - run: bash tests/test_apply_ts.sh
      - run: bash tests/test_second_opinion.sh
      - run: bash tests/test_pressure.sh
